version: '3'

vars:
  MVNW: '{{if eq OS "windows"}}cmd /c mvnw.cmd{{else}}./mvnw{{end}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list-all
  clean:
    desc: Clean the project
    cmds:
      - '{{.MVNW}} clean'

  compile:
    desc: Compile the project without tests
    cmds:
      - '{{.MVNW}} -DskipTests compile'

  test:
    desc: Run tests
    cmds:
      - '{{.MVNW}} test'

  build:
    desc: Build the project
    cmds:
      - '{{.MVNW}} package'

  format:
    desc: Format Java sources
    cmds:
      - '{{.MVNW}} -q spring-javaformat:apply'

  lint:
    desc: Run PMD checks
    cmds:
      - '{{.MVNW}} -q pmd:check'

  jooq:
    desc: Generate jOOQ sources
    cmds:
      - '{{.MVNW}} -Pjooq generate-sources'

  sortpom:
    desc: Sort the root POM
    cmds:
      - '{{.MVNW}} -q sortpom:sort'
