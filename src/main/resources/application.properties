spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:./db/test
spring.datasource.username=sa
spring.datasource.password=sa
spring.jooq.sql-dialect=h2
spring.web.resources.add-mappings=false
spring.jackson.deserialization.unwrap-root-value=true
management.endpoints.web.exposure.include=health,info

# Override JWT_SECRET in every deployed environment. The stable development default keeps
# local tokens valid across restarts; it is not intended for production use.
realworld.jwt.secret=${JWT_SECRET:development-only-secret-change-before-deploying}
realworld.jwt.expiration=PT24H

server.servlet.context-path=/api
